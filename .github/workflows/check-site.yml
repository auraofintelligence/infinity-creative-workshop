name: Check training site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build the static site
        run: npm run build
      - name: Check calculations, pages and assets
        run: npm test
      - name: Check generated files match their sources
        run: git diff --exit-code
